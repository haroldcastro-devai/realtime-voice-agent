[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-voice-agent"
version = "0.1.0"
description = "Independent realtime voice agent: AudioSocket, STT, LLM, TTS, barge-in."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Harold Castro" }]
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.22.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[project.scripts]
rva = "rva.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
